<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d0f12;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Toolbar */
    .topbar {
      background-color: #14171f;
      border-bottom: 1px solid #232734;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-badge span {
      color: #f590dd;
    }

    .tool-title {
      font-size: 12.5px;
      background: #1e2330;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      border: 1px solid #2e3547;
    }

    .controls-section {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      appearance: none;
      background-color: #1b1f2b;
      color: #f1f5f9;
      border: 1px solid #333c4d;
      padding: 8px 36px 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .select-wrapper select:focus {
      border-color: #f590dd;
      box-shadow: 0 0 0 2px rgba(245, 144, 221, 0.2);
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 9px;
      color: #94a3b8;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      background: #1b1f2b;
      border: 1px solid #333c4d;
      border-radius: 6px;
      padding: 3px;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: #f590dd;
      color: #ffffff;
    }

    /* Main Preview Container */
    .studio-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      background: radial-gradient(circle at 50% 10%, #171b26 0%, #0d0f12 70%);
      overflow-y: auto;
    }

    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .preview-frame-container {
      background: #ffffff;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 0;
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
      width: 540px;
      max-width: 100%;
    }

    .preview-frame-container.mobile {
      width: 385px;
      border: none;
      border-radius: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    /* Dark Mode Simulation (Phone / Gmail Dark Mode) */
    .preview-frame-container.dark-theme {
      background: #18191c;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
    }
    .preview-frame-container.dark-theme .em-body {
      background: transparent !important;
      color: #1e293b !important;
    }
    .preview-frame-container.dark-theme .em-card {
      background-color: #ffffff !important;
      color: #1e293b !important;
    }
    .preview-frame-container.dark-theme .logo-dark {
      display: block !important;
    }
    .preview-frame-container.dark-theme .logo-light {
      display: none !important;
    }

    #email-target-root {
      width: 100%;
    }

    /* Meta Info Bar */
    .meta-bar {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .meta-bar span {
      color: #94a3b8;
    }

      </div>

          🖥️ Desktop
        </button>
        <button class="toggle-btn" id="btn-mobile" onclick="setViewport('mobile')">
          📱 Mobile
        </button>
      </div>

      <div class="btn-group">

          ☀️ Light
        </button>
        <button class="toggle-btn" id="btn-dark" onclick="setTheme('dark')">

    function renderSelectedTemplate() {
      const picker = document.getElementById("template-picker");
      const key = picker.value;
      const tpl = templates[key] || templates.courier_received;

      document.getElementById("subject-preview").innerText = tpl.subject;
      document.getElementById("email-target-root").innerHTML = sharedStyles + tpl.html;
    }

    function setViewport(mode) {
      const container = document.getElementById("frame-container");
      const btnDesktop = document.getElementById("btn-desktop");
      const btnMobile = document.getElementById("btn-mobile");

      if (mode === "mobile") {
        container.classList.add("mobile");
        btnMobile.classList.add("active");
        btnDesktop.classList.remove("active");
      } else {
        container.classList.remove("mobile");
        btnDesktop.classList.add("active");
        btnMobile.classList.remove("active");
      }
    }

    function setTheme(mode) {
      const container = document.getElementById("frame-container");
      const btnLight = document.getElementById("btn-light");
      const btnDark = document.getElementById("btn-dark");

      if (mode === "dark") {
        container.classList.add("dark-theme");
        btnDark.classList.add("active");
        btnLight.classList.remove("active");
      } else {
        container.classList.remove("dark-theme");
        btnLight.classList.add("active");
        btnDark.classList.remove("active");
      }
    }

    // Initialize first render
    renderSelectedTemplate();
  </script>
