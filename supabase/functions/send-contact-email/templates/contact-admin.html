<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contact Inquiry - EIMAH</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d0f12;
        color: #ffffff;
        margin: 0;
        padding: 24px;
      }
      .card {
        background-color: #161920;
        border: 1px solid #2a2e39;
        border-radius: 16px;
        max-width: 600px;
        margin: 0 auto;
        overflow: hidden;
      }
      .header {
        background: linear-gradient(135deg, #1c202a 0%, #12141a 100%);
        padding: 32px 28px;
        border-bottom: 1px solid #2a2e39;
        text-align: center;
      }
      .brand {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin: 0;
      }
      .brand span {
        color: #f590dd;
      }
      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 12px;
        background: rgba(245, 144, 221, 0.15);
        border: 1px solid rgba(245, 144, 221, 0.3);
        border-radius: 20px;
        color: #f590dd;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .content {
        padding: 28px;
      }
      .field-group {
        margin-bottom: 20px;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8e95a5;
        margin-bottom: 6px;
      }
      .value {
        font-size: 15px;
        color: #ffffff;
        font-weight: 500;
      }
      .message-box {
        background: #0d0f12;
        border: 1px solid #2a2e39;
        border-left: 3px solid #f590dd;
        border-radius: 8px;
        padding: 16px;
        font-size: 14px;
        line-height: 1.6;
        color: #e1e4ea;
        white-space: pre-wrap;
        margin-top: 8px;
      }
      .reply-hint {
        color: #f590dd;
        font-weight: 600;
        font-size: 12px;
        margin-top: 16px;
        display: block;
        text-align: center;
      }
      .footer {
        padding: 20px 28px;
        background: #12141a;
        border-top: 1px solid #2a2e39;
        font-size: 12px;
        color: #6b7280;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1 class="brand">EIMAH<span>.</span></h1>
        <div class="badge">New Contact Inquiry</div>
      </div>
      <div class="content">
        <div class="field-group">
          <div class="label">Customer Name</div>
          <div class="value">{{name}}</div>
        </div>
        <div class="field-group">
          <div class="label">Email Address</div>
          <div class="value">
            <a href="mailto:{{email}}" style="color: #f590dd; text-decoration: none;">{{email}}</a>
          </div>
        </div>
        <div class="field-group">
          <div class="label">Phone Number</div>
          <div class="value">{{phone}}</div>
        </div>
        <div class="field-group">
          <div class="label">Inquiry Subject</div>
          <div class="value">{{subject}}</div>
        </div>
        <div class="field-group">
          <div class="label">Message</div>
          <div class="message-box">{{message}}</div>
        </div>
        <span class="reply-hint">💡 Tip: You can click "Reply" directly in your email app to respond to {{name}}.</span>
      </div>
      <div class="footer">
        EIMAH Studio Automated Notification System
      </div>
    </div>
  </body>
</html>
